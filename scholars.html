<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <meta name="description" content="علماء الإسلام | دار الخلافة - سير أعلام الأمة: الإمام أحمد بن حنبل، ابن القيم، ابن تيمية، محمد بن عبد الوهاب">
    <title>علماء الإسلام | دار الخلافة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #020617;
            --bg-card: rgba(15, 23, 42, 0.7);
            --bg-glass: rgba(255, 255, 255, 0.03);
            --gold-light: #fbbf24;
            --gold-dark: #b45309;
            --emerald-light: #34d399;
            --emerald-dark: #047857;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --radius-md: 14px;
            --radius-lg: 20px;
            --font-main: 'Tajawal', system-ui, sans-serif;
            --font-quran: 'Amiri', serif;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: var(--font-main);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
        }
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            pointer-events: none;
            opacity: 0.35;
        }
        body::before { width: 300px; height: 300px; background: #047857; top: -100px; right: -100px; }
        body::after { width: 400px; height: 400px; background: #b45309; bottom: -150px; left: -150px; }
        .topbar {
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
        }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
        .logo-icon {
            width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
            border-radius: 8px; color: #000; font-weight: 900; font-size: 1.2rem;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }
        .logo-text h1 {
            font-size: 1.1rem; font-weight: 800;
            background: linear-gradient(to left, var(--gold-light), var(--emerald-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; line-height: 1.2;
        }
        .logo-text p { font-size: 0.7rem; color: var(--text-muted); }
        .back-btn-top {
            width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: 8px; color: var(--text-primary);
            text-decoration: none;
        }
        .back-btn-top svg { width: 20px; height: 20px; }
        .wrap { max-width: 780px; margin: 0 auto; padding: 24px 16px 60px; }
        .hero { text-align: center; padding: 20px 0 20px; }
        .hero-badge {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 6px 16px;
            border-radius: 50px;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            color: var(--emerald-light);
            font-size: 0.8rem;
            margin-bottom: 16px;
        }
        .badge-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--emerald-light);
            box-shadow: 0 0 10px var(--emerald-light);
            animation: pulseDot 2s infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        .hero-title { font-size: 2rem; font-weight: 900; line-height: 1.3; margin-bottom: 10px; }
        .gradient-text {
            background: linear-gradient(135deg, var(--gold-light), var(--emerald-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero p { color: var(--text-muted); font-size: 0.95rem; }

        /* أزرار التنقل بين العلماء */
        .scholars-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 16px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .scholars-nav::-webkit-scrollbar { display: none; }
        .scholar-tab {
            flex-shrink: 0;
            padding: 10px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .scholar-tab:active { transform: scale(0.95); }
        .scholar-tab.active {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
            color: #000;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(251,191,36,0.3);
        }

        /* بطاقة العالم */
        .scholar-card {
            display: none;
            position: relative;
            padding: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: fadeIn 0.5s ease-out;
        }
        .scholar-card.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .scholar-card::before {
            content: '';
            position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(251,191,36,0.06), transparent);
            transition: left 1s ease;
            pointer-events: none;
            animation: cardShine 8s ease-in-out infinite;
        }
        @keyframes cardShine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }
        .scholar-card::after {
            content: '';
            position: absolute; top: 0; right: 0;
            width: 4px; height: 100%;
            background: linear-gradient(to bottom, var(--gold-light), var(--emerald-light));
        }

        .scholar-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .scholar-avatar {
            width: 70px; height: 70px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
            border-radius: 50%;
            color: #000;
            font-weight: 900;
            font-size: 1.8rem;
            flex-shrink: 0;
            box-shadow: 0 0 25px rgba(251,191,36,0.4);
            font-family: var(--font-quran);
        }
        .scholar-title-wrap { flex: 1; }
        .scholar-name {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--gold-light);
            line-height: 1.3;
            margin-bottom: 4px;
            font-family: var(--font-quran);
        }
        .scholar-nick {
            font-size: 0.85rem;
            color: var(--emerald-light);
            font-weight: 600;
            margin-bottom: 4px;
        }
        .scholar-dates {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .scholar-section {
            margin-bottom: 22px;
        }
        .scholar-section:last-child { margin-bottom: 0; }
        .section-icon-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            font-weight: 800;
            color: var(--gold-light);
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
        }
        .section-icon-title span:first-child {
            font-size: 1.3rem;
        }
        .scholar-text {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.95;
            text-align: justify;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        @media (max-width: 480px) {
            .info-grid { grid-template-columns: 1fr; }
        }
        .info-box {
            padding: 12px 14px;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
        }
        .info-box small {
            display: block;
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }
        .info-box b {
            font-size: 0.9rem;
            color: var(--text-primary);
            font-weight: 700;
        }
        .info-box .emerald { color: var(--emerald-light); }

        .list-items {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .list-items li {
            position: relative;
            padding-right: 22px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.8;
        }
        .list-items li::before {
            content: '✦';
            position: absolute;
            right: 0;
            top: 0;
            color: var(--gold-light);
            font-size: 0.75rem;
        }

        .books-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        @media (max-width: 480px) {
            .books-grid { grid-template-columns: 1fr; }
        }
        .book-item {
            padding: 10px 12px;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.82rem;
            color: var(--text-secondary);
            border-right: 3px solid var(--emerald-light);
            transition: all var(--transition);
        }
        .book-item:hover {
            background: rgba(52,211,153,0.05);
            transform: translateX(-3px);
        }
        .book-item b {
            display: block;
            color: var(--emerald-light);
            font-weight: 700;
            margin-bottom: 2px;
            font-size: 0.85rem;
        }

        .quote-box {
            padding: 16px 18px;
            background: linear-gradient(135deg, rgba(251,191,36,0.08), rgba(52,211,153,0.05));
            border: 1px solid rgba(251,191,36,0.2);
            border-radius: var(--radius-md);
            font-family: var(--font-quran);
            font-size: 1rem;
            color: var(--text-primary);
            line-height: 1.9;
            text-align: center;
            position: relative;
        }
        .quote-box::before {
            content: '❝';
            position: absolute;
            top: -8px;
            right: 16px;
            font-size: 2rem;
            color: var(--gold-light);
            opacity: 0.4;
        }
        .quote-box span {
            display: block;
            margin-top: 8px;
            font-size: 0.78rem;
            color: var(--gold-light);
            font-family: var(--font-main);
            font-weight: 600;
        }

        .fav-quote {
            text-align: center;
            padding: 14px;
            background: var(--bg-glass);
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            color: var(--gold-light);
            font-family: var(--font-quran);
            line-height: 1.8;
            margin-top: 16px;
        }

        .footer {
            text-align: center;
            padding: 30px 16px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-family: var(--font-quran);
            border-top: 1px solid var(--border-color);
            margin-top: 30px;
        }
    </style>
</head>

                document.querySelectorAll('.scholar-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.scholar-card').forEach(c => c.classList.remove('active'));

            });

        });

        // بناء البطاقات
        scholarsData.forEach((s, index) => {
            const card = document.createElement('div');
            card.className = 'scholar-card' + (index === 0 ? ' active' : '');
            card.id = 'scholar-' + s.id;

            let sectionsHTML = '';

            s.sections.forEach(sec => {
                sectionsHTML += `
                    <div class="scholar-section">
                        <div class="section-icon-title">
                            <span>${sec.icon}</span>
                            <span>${sec.title}</span>
                        </div>
                `;

                if (sec.text) {
                    sectionsHTML += `<p class="scholar-text">${sec.text}</p>`;
                }

                if (sec.books) {
                    sectionsHTML += `<div class="books-grid">`;
                    sec.books.forEach(b => {
                        sectionsHTML += `
                            <div class="book-item">
                                <b>${b.name}</b>
                                ${b.desc}
                            </div>
                        `;
                    });
                    sectionsHTML += `</div>`;
                }

                if (sec.quote) {
                    sectionsHTML += `
                        <div class="quote-box">
                            ${sec.quote}
                            <span>— ${sec.quoteBy}</span>
                        </div>
                    `;
                }

                sectionsHTML += `</div>`;
            });

                    <div class="scholar-avatar">${s.letter}</div>
                    <div class="scholar-title-wrap">
                        <h2 class="scholar-name">${s.name}</h2>
                        <p class="scholar-nick">${s.nick}</p>
                        <p class="scholar-dates">📅 ${s.dates}</p>
