<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <meta name="description" content="الأخبار الرسمية | دار الخلافة - آخر أخبار ومستجدات المؤلف سيف بن عمران">
    <title>الأخبار الرسمية | دار الخلافة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet"></noscript>
    <style>
        :root {
            --bg-primary: #020617;
            --bg-card: rgba(15, 23, 42, 0.7);
            --bg-glass: rgba(255, 255, 255, 0.03);
            --gold-light: #fbbf24;
            --gold-dark: #b45309;
            --emerald-light: #34d399;
            --emerald-dark: #047857;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --radius-md: 14px;
            --radius-lg: 20px;
            --font-main: 'Tajawal', system-ui, sans-serif;
            --font-quran: 'Amiri', serif;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: var(--font-main);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
        }
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            pointer-events: none;
            opacity: 0.35;
        }
        body::before {
            width: 300px; height: 300px;
            background: #047857;
            top: -100px; right: -100px;
        }
        body::after {
            width: 400px; height: 400px;
            background: #b45309;
            bottom: -150px; left: -150px;
        }
        .topbar {
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
        }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
        .logo-icon {
            width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
            border-radius: 8px; color: #000; font-weight: 900; font-size: 1.2rem;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }
        .logo-text h1 {
            font-size: 1.1rem; font-weight: 800;
            background: linear-gradient(to left, var(--gold-light), var(--emerald-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; line-height: 1.2;
        }
        .logo-text p { font-size: 0.7rem; color: var(--text-muted); }
        .back-btn-top {
            width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: 8px; color: var(--text-primary);
            text-decoration: none;
        }
        .back-btn-top svg { width: 20px; height: 20px; }
        .wrap {
            max-width: 640px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }
        .hero {
            text-align: center;
            padding: 20px 0 30px;
        }
        .hero-badge {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 6px 16px;
            border-radius: 50px;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            color: var(--emerald-light);
            font-size: 0.8rem;
            margin-bottom: 16px;
        }
        .badge-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--emerald-light);
            box-shadow: 0 0 10px var(--emerald-light);
            animation: pulseDot 2s infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        .hero-title {
            font-size: 2rem; font-weight: 900;
            line-height: 1.3; margin-bottom: 10px;
        }
        .gradient-text {
            background: linear-gradient(135deg, var(--gold-light), var(--emerald-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero p { color: var(--text-muted); font-size: 0.95rem; }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .news-card {
            position: relative;
            padding: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            overflow: hidden;
            transition: all var(--transition);
            animation: slideUp 0.6s ease-out forwards;
            opacity: 0;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* لمعان أفقي */
        .news-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(251,191,36,0.08), transparent);
            transition: left 0.8s ease;
            pointer-events: none;
        }
        .news-card:hover::before,
        .news-card:active::before {
            left: 100%;
        }

        /* شريط جانبي ذهبي */
        .news-card::after {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--gold-light), var(--emerald-light));
        }

        .news-card:active {
            transform: scale(0.98);
        }

        .news-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .news-icon {
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(251,191,36,0.1);
            border: 1px solid rgba(251,191,36,0.25);
            border-radius: var(--radius-md);
            font-size: 1.3rem;
            flex-shrink: 0;
        }
        .news-meta {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .news-date {
            font-size: 0.7rem;
            color: var(--gold-light);
            font-weight: 600;
        }
        .news-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.4;
        }
        .news-content {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.9;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .new-badge {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 8px;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: #fff;
            border-radius: 50px;
            margin-right: 6px;
            vertical-align: middle;
            box-shadow: 0 0 10px rgba(239,68,68,0.4);
            animation: pulseNew 1.5s infinite;
        }
        @keyframes pulseNew {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.85; }
        }

        .footer {
            text-align: center;
            padding: 30px 16px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-family: var(--font-quran);
            border-top: 1px solid var(--border-color);
            margin-top: 30px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state div { font-size: 3rem; margin-bottom: 12px; }
    </style>
</head>
<body>

    <header class="topbar">
        <a href="index.html" class="brand">
            <div class="logo-icon">س</div>
            <div class="logo-text">
                <h1>دار الخلافة</h1>
                <p>سيف بن عمران</p>
            </div>
        </a>
        <a href="index.html" class="back-btn-top" aria-label="رجوع">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
        </a>
    </header>

    <main class="wrap">

        <section class="hero">
            <div class="hero-badge">
                <span class="badge-dot"></span>
                آخر المستجدات
            </div>
            <h1 class="hero-title">الأخبار <span class="gradient-text">الرسمية</span></h1>
            <p>تابع آخر أخبار ومستجدات دار الخلافة.</p>
        </section>

        <section class="news-list" id="newsList">
            <!-- تظهر الأخبار هنا تلقائيًا -->
        </section>

    </main>

    <div class="footer">
          الله أكبر والعزة لله ولرسوله وللمؤمنين
    </div>

    <script>
        /* ==========================================================
           🟢 هنا تضيف الأخبار — بسهولة تامة!
           ==========================================================
           كل خبر عبارة عن كائن { } بين قوسين { }:
           
           - icon: أيقونة (إيموجي)
           - title: عنوان الخبر
           - date: التاريخ (اكتبه كما تشاء)
           - content: نص الخبر
           - isNew: هل تريد إظهار شارة "جديد" الحمراء؟ (true / false)

           🎯 الأحدث في الأعلى (الترتيب كما تكتبه هنا).
           ========================================================== */

        const newsData = [       
     
        {
        
        icon: "⏳",
        title: "تحديث جديد",
        date: "26 سبتمبر 2026",
        content: "قريبا بإذن الله سيتم إصدار كتاب جديد بعنوان : حقيقة الصوفيه. .... والحمدلله رب العالمين.",
        isNew: true
    },

      
    {
        icon: "🗣️",
        title: "تحديث جديد",
        date: "21 سبتمبر 2026",
        content: "بحمد الله وتوفيقه، تم إطلاق التطبيق الرسمي لموقع دار الخلافه... الرجاء التواصل مع المؤلف للحصول على النسخه .. بارك الله فيكم.",
        isNew: true
    },

    {
        icon: "📢",
        title: "إطلاق الموقع الرسمي لدار الخلافة",
        date: "8 سبتمبر 2026",
        content: "بحمد الله وتوفيقه، تم إطلاق الموقع الرسمي للمؤلف سيف بن عمران (أبو البراء المصري). الموقع يحتوي على المكتبة الدينية، وصفحات التواصل، والإخوة الموحدين، والمصادر. نسأل الله أن ينفع به.",
        isNew: false
    },

    {
        icon: "📘",
        title: "صدور كتاب: البيان الصحيح لمن بدّل دين المسيح",
        date: "19 سبتمبر 2026",
        content: "صدر بحمد الله الكتاب الأول من سلسلة الردود العلمية على النصرانية، وهو دراسة منهجية نقدية تكشف التحريف الذي أصاب الرسالة المسيحية. الكتاب متوفر للقراءة عبر الرابط في صفحة المؤلفات.",
        isNew: false
    },

    {
        icon: "📗",
        title: "صدور كتاب: أصل العقيدة",
        date: "14 سبتمبر 2026",
        content: "صدور كتاب (أصل العقيدة) الذي يضع الأساس المتين للعقيدة الإسلامية الصحيحة بفهم السلف الصالح، بأسلوب علمي مبسط يستند إلى الكتاب والسنة.",
        isNew: false
    },

    {
        icon: "📕",
        title: "صدور كتاب: نقد المذهب الشيعي",
        date: "4 سبتمبر 2026",
        content: "صدور كتاب (نقد المذهب الشيعي) الذي يتناول أبرز العقائد التي انفرد بها المذهب الاثنا عشري، بالاعتماد على المصادر الشيعية نفسها لإثبات تناقضها مع القرآن والسنة.",
        isNew: false
    }

];

        /* ==========================================================
           ⛔ لا تعدل ما بعد هذا السطر إلا إذا كنت تعرف ما تفعله.
           ========================================================== */

        (function renderNews() {
            const container = document.getElementById('newsList');

            if (!newsData || newsData.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div>📭</div>
                        <p>لا توجد أخبار حاليًا. تابعنا قريبًا.</p>
                    </div>
                `;
                return;
            }

            newsData.forEach((news, index) => {
                const card = document.createElement('div');
                card.className = 'news-card';
                card.style.animationDelay = (index * 0.1) + 's';

                card.innerHTML = `
                    <div class="news-header">
                        <div class="news-icon">${news.icon || '📰'}</div>
                        <div class="news-meta">
                            <span class="news-date">📅 ${news.date || ''}</span>
                            <span class="news-title">
                                ${news.isNew ? '<span class="new-badge">جديد</span>' : ''}
                                ${news.title || ''}
                            </span>
                        </div>
                    </div>
                    <p class="news-content">${news.content || ''}</p>
                `;

                container.appendChild(card);
            });
        })();
    </script>
</body>
</html>
