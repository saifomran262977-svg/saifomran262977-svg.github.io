<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <meta name="description" content="مقاطع دعوية قصيرة | دار الخلافة">
    <title>مقاطع دعوية | دار الخلافة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%;
            background: #020617;
            color: #f8fafc;
            font-family: 'Tajawal', sans-serif;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at top right, rgba(52,211,153,0.10), transparent 50%),
                radial-gradient(circle at bottom left, rgba(251,191,36,0.10), transparent 50%);
            pointer-events: none;
        }
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(2,6,23,0.95), transparent);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
        }
        .logo {
            width: 40px; height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fbbf24, #b45309);
            border-radius: 10px;
            color: #000;
            font-weight: 900;
            font-size: 1.2rem;
            box-shadow: 0 0 20px rgba(251,191,36,0.4);
        }
        .brand-text b {
            font-size: 0.95rem;
            font-weight: 800;
            display: block;
        }
        .brand-text small {
            font-size: 0.7rem;
            color: #fbbf24;
            font-weight: 500;
        }
        .close {
            width: 40px; height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            text-decoration: none;
        }
        .close svg { width: 20px; height: 20px; }
        .empty {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 30px;
            text-align: center;
            z-index: 5;
        }
        .empty-icon {
            font-size: 5rem;
            filter: drop-shadow(0 0 30px rgba(251,191,36,0.4));
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .empty h2 {
            font-size: 1.6rem;
            color: #fbbf24;
            font-weight: 800;
            line-height: 1.4;
        }
        .empty p {
            font-size: 1rem;
            color: #94a3b8;
            line-height: 2;
            max-width: 340px;
            font-family: 'Amiri', serif;
        }
        .empty-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #fbbf24, #b45309);
            color: #000;
            font-weight: 800;
            border-radius: 14px;
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 10px;
            box-shadow: 0 0 25px rgba(251,191,36,0.35);
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="brand">
            <div class="logo">س</div>
            <div class="brand-text">
                <b>دار الخلافة</b>
                <small>مقاطع دعوية</small>
            </div>
        </a>
        <a href="index.html" class="close" aria-label="إغلاق">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </a>
    </header>

    <div class="empty">
        <div class="empty-icon">🎬</div>
        <h2>لا توجد مقاطع بعد</h2>
        <p>ترقبوا قريبًا بإذن الله، سيتم إضافة المقاطع الدعوية القصيرة.</p>
        <a href="index.html" class="empty-back">
            ← العودة إلى الرئيسية
        </a>
    </div>

</body>
</html>
